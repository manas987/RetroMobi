# /etc/nginx/sites-available/retromobi  (symlink into sites-enabled)
# Replace retromobi.in with your domain. Cloudflare proxies the domain (orange
# cloud) and nginx serves a Cloudflare Origin CA certificate: docs/deployment.md §6.

server {
    listen 80;
    listen [::]:80;
    server_name retromobi.in www.retromobi.in;
    return 301 https://retromobi.in$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name retromobi.in www.retromobi.in;

    ssl_certificate     /etc/ssl/cloudflare/origin.pem;
    ssl_certificate_key /etc/ssl/cloudflare/origin.key;

    # $remote_addr becomes the visitor's IP, from CF-Connecting-IP, only when the
    # request came from a Cloudflare address. Generated by the script in §6.
    include /etc/nginx/cloudflare-realip.conf;

    # Files go browser -> R2 directly with presigned URLs; API bodies are small JSON.
    client_max_body_size 1m;

    # Overwrite (not append) so a client-supplied X-Forwarded-For never reaches
    # the backend's rate limiter.
    proxy_set_header Host              $host;
    proxy_set_header X-Forwarded-For   $remote_addr;
    proxy_set_header X-Forwarded-Proto https;
    proxy_http_version 1.1;

    location /api/ {
        proxy_pass http://127.0.0.1:3201; # BACKEND_PORT
        proxy_read_timeout 60s;
    }

    location / {
        proxy_pass http://127.0.0.1:5180; # FRONTEND_PORT
    }
}
