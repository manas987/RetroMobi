name: retromobi

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: retromobi
      POSTGRES_PASSWORD: retromobi
      POSTGRES_DB: retromobi
    ports:
      # DB_PORT from .env in this folder (compose reads it): 5434 by default so it
      # never clashes with another project's Postgres on 5432/5433.
      - "${DB_PORT:-5434}:5432"
    volumes:
      - retromobi_pgdata:/var/lib/postgresql/data
      - ./docker/init-test-db.sql:/docker-entrypoint-initdb.d/init-test-db.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U retromobi"]
      interval: 2s
      timeout: 2s
      retries: 20

volumes:
  retromobi_pgdata:
    # The seeded dev database (src/DB/seedTestAccounts.ts). The older dev data
    # is still in the backend_retromobi_pgdata volume if you ever need it.
    name: retromobi_pgtest
